<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Strain Widget — Embed Example</title>
</head>
<body>
  <h1>Example host page</h1>
  <p>This is what dropping the widget into any existing website looks like:</p>

  <div id="strain-widget"></div>

  <!-- Point data-api at wherever you deploy server/server.js -->
  <script
    src="strain-widget.js"
    data-api="http://localhost:4000"
    data-target="#strain-widget">
  </script>
</body>
</html>
